name: CI

on:
  push:
  pull_request:

# Read-only. This workflow is a correctness gate, not a deployment pipeline: it
# needs no secrets and must never be able to write to the repository.
permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches "engines.node": ">=22.13.0" in package.json.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # `npm test` already runs `npm run build` first, so the build is covered
      # here and must not be repeated as a separate step.
      - name: Test
        run: npm test
